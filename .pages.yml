# Admin-Bereich (Pages CMS – https://app.pagescms.org)
# Hier wird festgelegt, was im Admin-Bereich bearbeitet werden kann.

media:
  input: public/uploads
  output: /uploads
  categories: [image]
  rename: safe

content:
  - name: produkte
    label: Produkte
    type: collection
    path: content/produkte
    format: yaml
    filename: "{year}-{month}-{day}-{primary}.yml"
    view:
      fields: [bild, name, kategorie, sichtbar]
      primary: name
    fields:
      - name: name
        label: Name
        description: z. B. „Smoking Schwarz“ oder „Dreiteiler Navy“.
        type: string
        required: true
      - name: bild
        label: Foto
        type: image
      - name: kategorie
        label: Kategorie
        type: reference
        required: true
        options:
          collection: kategorien
          value: "{path}"
          label: "{name}"
          search: name
      - name: unterkategorie
        label: Unterkategorie (optional)
        description: Nur wählen, wenn sie zur Kategorie passt, z. B. Anzüge → Smoking.
        type: reference
        options:
          collection: unterkategorien
          value: "{path}"
          label: "{name}"
          search: name
      - name: farbe
        label: Farbe
        type: reference
        required: true
        options:
          collection: farben
          value: "{path}"
          label: "{name}"
          search: name
      - name: fuer
        label: Für
        type: select
        default: herren
        options:
          values:
            - name: herren
              label: Herren
            - name: kinder
              label: Kinder
      - name: uebergroesse
        label: Auch in Übergröße (bis 80)
        type: boolean
        default: false
      - name: preis
        label: Preis (optional)
        description: z. B. „149 €“ oder „ab 120 €“. Leer lassen, wenn kein Preis angezeigt werden soll.
        type: string
      - name: sichtbar
        label: Auf der Webseite anzeigen
        type: boolean
        default: true

  - name: kategorien
    label: Kategorien
    type: collection
    path: content/kategorien
    format: yaml
    filename: "{primary}.yml"
    view:
      fields: [name, reihenfolge, sichtbar]
      primary: name
      sort: reihenfolge
    fields:
      - name: name
        label: Name (Mehrzahl)
        type: string
        required: true
      - name: einzahl
        label: Einzahl
        description: z. B. „Anzug“ – für Texte wie „1 Anzug“.
        type: string
        required: true
      - name: reihenfolge
        label: Reihenfolge im Menü
        type: number
        default: 10
      - name: sichtbar
        label: Auf der Webseite anzeigen
        type: boolean
        default: true
      - name: kurztext
        label: Kurztext (Startseite)
        type: string
      - name: preis_hinweis
        label: Preis-Hinweis (optional)
        type: string
      - name: intro
        label: Einleitung auf der Kategorieseite
        type: text
      - name: seo_beschreibung
        label: Beschreibung für Google
        type: text
      - name: filter_herren_kinder
        label: Filter „Herren / Kinder“ anzeigen
        type: boolean
        default: false
      - name: filter_uebergroesse
        label: Filter „Übergrößen“ anzeigen
        type: boolean
        default: false
      - name: zeichnung
        label: Zeichnung in der Startseiten-Animation
        type: select
        default: keine
        options:
          values:
            - name: anzug
              label: Anzug
            - name: mantel
              label: Mantel
            - name: hemd
              label: Hemd
            - name: fliege
              label: Fliege (Accessoires)
            - name: schuhe
              label: Schuhe
            - name: keine
              label: Keine

  - name: unterkategorien
    label: Unterkategorien
    type: collection
    path: content/unterkategorien
    format: yaml
    filename: "{primary}.yml"
    view:
      fields: [name, kategorie, reihenfolge]
      primary: name
      sort: reihenfolge
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: kategorie
        label: Gehört zu Kategorie
        type: reference
        required: true
        options:
          collection: kategorien
          value: "{path}"
          label: "{name}"
          search: name
      - name: reihenfolge
        label: Reihenfolge
        type: number
        default: 10
      - name: startseite
        label: Als Kachel auf der Startseite zeigen
        type: boolean
        default: false
      - name: bild
        label: Foto für die Startseiten-Kachel (optional)
        type: image
      - name: kurztext
        label: Kurztext (Startseiten-Kachel)
        type: string

  - name: farben
    label: Farben
    type: collection
    path: content/farben
    format: yaml
    filename: "{primary}.yml"
    view:
      fields: [name, farbcode]
      primary: name
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: farbcode
        label: Farbcode
        description: z. B. #1F2A44 – bestimmt den Farbpunkt im Filter.
        type: string
        required: true

  - name: einstellungen
    label: Öffnungszeiten & Kontakt
    type: file
    path: content/einstellungen.yml
    format: yaml
    fields:
      - name: preis_hinweis
        label: Preis-Botschaft (Startseite)
        type: string
      - name: oeffnungszeiten
        label: Öffnungszeiten
        type: object
        fields:
          - name: tage
            label: Tage (Anzeige)
            type: string
          - name: von
            label: Öffnet um (HH:MM)
            type: string
          - name: bis
            label: Schließt um (HH:MM)
            type: string
      - name: sonntag
        label: Verkaufsoffene Sonntage
        type: object
        fields:
          - name: hinweis
            label: Hinweistext
            type: string
          - name: von
            label: Öffnet um (HH:MM)
            type: string
          - name: bis
            label: Schließt um (HH:MM)
            type: string
          - name: termine
            label: Termine
            type: date
            list: true
      - name: filialen
        label: Filialen
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
          - name: strasse
            label: Straße und Hausnummer
            type: string
          - name: ort
            label: PLZ und Ort
            type: string
          - name: telefon
            label: Telefon
            type: string
          - name: whatsapp
            label: Telefonnummer hat WhatsApp
            type: boolean
      - name: anfahrt
        label: Anfahrt (Parken, Bus)
        type: string
      - name: email
        label: E-Mail
        type: string
      - name: grosshandel_whatsapp
        label: WhatsApp-Nummer für Händleranfragen
        type: string
      - name: social
        label: Social Media
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
          - name: url
            label: Link
            type: string
      - name: impressum
        label: Impressum
        type: object
        fields:
          - name: anschrift
            label: Geschäftsanschrift
            type: string
          - name: ust_id
            label: USt-ID
            type: string
